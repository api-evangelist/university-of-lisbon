name: University of Lisbon — Education Domain Standard Conformance
regime: education
generated: '2026-09-01'
method: probed
source:
  - https://repositorio.ulisboa.pt/server/oai/request?verb=Identify
  - https://catalogo-bibliotecas.ulisboa.pt/cgi-bin/koha/oai.pl?verb=Identify
  - https://id.ulisboa.pt/nidp/saml2/metadata
  - https://repositorio.ulisboa.pt/server/api/integration/externalsources
  - https://api.datacite.org/clients/qwbt.ulisboa
