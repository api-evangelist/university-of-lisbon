surfaces:
  - surface: FenixEdu Academic API (Instituto Superior Tecnico)
    x-operator: institution
    anonymous_access: true
    anonymous_scope: >-
      Institution metadata, academic terms, contacts, the degree and course catalog,
      campus spaces and blueprints, parking, canteen, shuttle and the serialized
      domain model are all readable with no credential. Probed 2026-09-01: GET /about,
      /academicterms, /degrees, /degrees/{id}, /spaces, /spaces/{id}, /parking,
      /contacts, /domainModel all returned 200 with no Authorization header.
    scheme: OAuth 2.0 authorization code
    implementation: Bennu OAuth, copyright Instituto Superior Tecnico, shipped with FenixEdu
    authorization_url: https://fenix.tecnico.ulisboa.pt/oauth/userdialog
    token_url: https://fenix.tecnico.ulisboa.pt/oauth/access_token
    evidence:
      - url: https://fenix.tecnico.ulisboa.pt/oauth/userdialog
        status: 200
        note: Returns the Bennu OAuth consent dialog carrying an Instituto Superior Tecnico copyright header.
      - url: https://fenix.tecnico.ulisboa.pt/oauth/access_token
        status: 405
        note: Method Not Allowed on GET — the token endpoint exists and accepts POST only.
      - url: https://fenix.tecnico.ulisboa.pt/api/fenix/v1/person
        status: 401
        note: 'Unauthenticated call returns {"error":"accessTokenInvalidFormat"}.'
    onboarding: >-
      Application registration requires an authenticated Instituto Superior Tecnico
      account. There is no self-service developer signup open to the public, and no
      published application-review or rate-limit policy.
    token_transport: Bearer access token
    scopes_published: false
    scopes_note: >-
      Access scopes are chosen per registered application inside FenixEdu rather than
      enumerated in any machine-readable or public document. No scope names are
      asserted here — see scopes/university-of-lisbon-scopes.yml.
  - surface: Universidade de Lisboa SAML 2.0 identity provider
