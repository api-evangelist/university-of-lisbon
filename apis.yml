    description: >-
      Anonymous HAL+JSON REST API of the institution's DSpace 7.6.1 repository —
      communities, collections, items, bitstreams, discovery search, metadata schemas
      and external-source integrations. The deployment is the institution's; the
      CONTRACT is DSpace's, shared by every DSpace 7 installation in the world, so no
      OpenAPI is saved into this repository for it. The deployed configuration is
      itself evidence: orcid, orcidWorks, datacite, crossref, openAIREFunding, pubmed,
      arxiv, scielo, sherpa and CienciaVitaeCurriculum are all enabled external sources.
