  - aid: university-of-lisbon:identity-federation-ulisboa
    name: Universidade de Lisboa SAML 2.0 Identity Provider (RCTSaai / eduGAIN)
    x-operator: federation
    x-operator-evidence: >-
      A federation is shared by definition and the IdP behind it is the institution's.
      The live metadata carries OrganizationName "Universidade de Lisboa" and
      OrganizationURL www.ulisboa.pt; the eduGAIN registry records entity 852270 under
      registration authority https://www.fccn.pt, federation code RCTSAAI, scope
      ulisboa.pt, first seen 2022-12-27, eccs_status 1.
    description: >-
      The institution's central SAML 2.0 identity provider, published into the
      Portuguese national identity federation RCTSaai (operated by FCCN) and onward to
      eduGAIN. Live machine-readable metadata: IDPSSODescriptor, SPSSODescriptor and
      AttributeAuthorityDescriptor; HTTP-POST and HTTP-Redirect SSO bindings; persistent
      and transient NameID formats. Runs on NetIQ Access Manager, not Shibboleth — the
      /idp/shibboleth path on idp.ulisboa.pt returns a Tomcat 404 — so `saml` is claimed
      and `shibboleth` is not. This is the strongest institution-operated machine-readable
      surface in the profile and it was missing from the June 2026 pass entirely.
    humanURL: https://technical.edugain.org/
    baseURL: https://id.ulisboa.pt/nidp/saml2/metadata
    tags: [ Identity Federation, SAML, eduGAIN, RCTSaai, Single Sign-On, Metadata ]
    properties:
      - type: IdentityFederation
        url: https://id.ulisboa.pt/nidp/saml2/metadata
      - type: Authentication
        url: authentication/university-of-lisbon-authentication.yml
  - aid: university-of-lisbon:identity-federation-tecnico
    name: Instituto Superior Tecnico SAML 2.0 Identity Provider (RCTSaai / eduGAIN)
    x-operator: federation
    x-operator-evidence: >-
      eduGAIN entity 673215, IDPSSODescriptor "ULisboa - Instituto Superior Tecnico",
      registration authority https://www.fccn.pt, scope tecnico.ulisboa.pt, first seen
      2018-01-30, sirtfi_status 1. The paired service provider, eduGAIN entity 673293,
      is "FenixEdu Tecnico Lisboa" at https://fenix.tecnico.ulisboa.pt, asserting the
      GEANT Data Protection Code of Conduct.
    description: >-
      The identity provider for Instituto Superior Tecnico, federated through RCTSaai
      into eduGAIN and asserting SIRTFI incident-response assurance — a stronger
      security posture than the central IdP declares. Its registered service provider in
      the same federation is the FenixEdu deployment listed above, which is how the
      academic API's person-scoped endpoints are authenticated. The entityID is an
      identifier, not a dereferenceable endpoint: metadata is distributed through the
      RCTSaai and eduGAIN aggregates.
    humanURL: https://technical.edugain.org/entities
    baseURL: https://technical.edugain.org/api.php?action=list_entities&format=json
    x-entity-id: https://id.tecnico.ulisboa.pt/saml
    x-entity-id-note: >-
      The SAML entityID is an identifier, not a dereferenceable endpoint — GET on it
      returns 404 from nginx, verified 2026-09-01. Metadata is distributed through the
      RCTSaai and eduGAIN aggregates, which is what baseURL points at.
    tags: [ Identity Federation, SAML, eduGAIN, RCTSaai, SIRTFI, Single Sign-On ]
    properties:
      - type: IdentityFederation
        url: https://technical.edugain.org/
      - type: Authentication
        url: authentication/university-of-lisbon-authentication.yml
