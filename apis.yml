description: >-
  The University of Lisbon (Universidade de Lisboa, ULisboa) is Portugal's largest
  public university — 18 schools plus the National Museum of Natural History and
  Science — and it is a federation of buyers rather than a producer of APIs. It runs no
  central developer portal, publishes no OpenAPI of its own, and has no open data
  portal: data.ulisboa.pt and dados.ulisboa.pt do not resolve, and the institution has
  no organization on the national portal dados.gov.pt. What it does operate, on its own
  infrastructure, is a small but real set of standards-based surfaces: the FenixEdu
  academic API at Instituto Superior Tecnico — institution-authored open-source software
  serving degrees, courses, campus spaces, blueprints, parking and a 1.2 MB serialized
  domain model anonymously, with Bennu OAuth 2.0 in front of person-scoped data; two
  independent OAI-PMH 2.0 endpoints, one over a 100,245-item DSpace 7.6.1 repository
  running since 2002 and one over the Koha union library catalog; and a SAML 2.0
  identity provider published into the national RCTSaai federation and onward to
  eduGAIN, alongside a second IdP for Instituto Superior Tecnico that asserts SIRTFI.
  The institution also authors an open-source Erasmus Without Paper node on GitHub,
  which is its most substantive piece of public API engineering. Everything else is
  someone else's contract running under its name — most importantly
  researchportal.ulisboa.pt, which looks institutional and CNAMEs to
  ulisbon.elsevierpure.com; its own OAI-PMH Identify calls it a "Pure OAI Repository"
  and its Pure Web Service OpenAPI is behind an API key. Its Erasmus Without Paper node
  is hosted by another university entirely. Both are recorded here as tenancies, with
  the vendor contract deliberately left out of this repository.
