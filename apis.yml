  - aid: university-of-lisbon:ewp-node
    name: Erasmus Without Paper node (HEI ulisboa.pt)
    x-operator: tenant
    x-operator-evidence: >-
      HOSTLESS-ADJACENT AND EASY TO MISCREDIT: the EWP registry names the institution as
      HEI ulisboa.pt with Erasmus code "P  LISBOA109" and PIC 949885305, but every
