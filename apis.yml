apis:
  - aid: university-of-lisbon:fenixedu-tecnico
    name: FenixEdu Academic API (Instituto Superior Tecnico)
    x-operator: institution
    x-operator-evidence: >-
      Host is under the institution's own registrable domain ulisboa.pt and resolves to
      193.136.102.79 on the Portuguese academic network. GET /about returns
      institutionName "Instituto Superior Tecnico"; the OAuth consent dialog at
      /oauth/userdialog carries an Instituto Superior Tecnico copyright notice. FenixEdu
      is open-source software authored by this institution, so both the deployment and
      the software are theirs. No vendor name appears anywhere in the served payloads.
    description: >-
      Public REST API of the FenixEdu academic information system operated by Instituto
      Superior Tecnico, a school of the University of Lisbon. Anonymous access to
      institution metadata, academic terms, contacts, the degree and course catalog,
      campus spaces and JPEG floor-plan blueprints, parking, canteen, shuttle and a
      serialized domain model; Bennu OAuth 2.0 in front of curriculum, enrolments,
      calendars and payments. Probed live 2026-09-01: nine anonymous endpoints returned
      200, /person returned 401, /canteen returned 500 with a Java stack trace.
    humanURL: https://fenixedu.org/dev/api/
