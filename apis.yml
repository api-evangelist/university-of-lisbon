    description: >-
      The institution's node in the Erasmus Without Paper network, through which student
      mobility, inter-institutional agreements, learning agreements and transcripts move
      between European universities machine-to-machine. Implements discovery 6.0.0,
      institutions 2.2.0, organizational-units 2.1.1 and iia-cnr 3.0.0, with HTTP
      signature client and server authentication. Twenty-seven endpoints are declared in
      the registry. Notably, the institution ALSO authors an open-source EWP node
      implementation on GitHub that it does not appear to be the operator of here.
    humanURL: https://registry.erasmuswithoutpaper.eu/
